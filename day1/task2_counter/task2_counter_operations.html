<!DOCTYPE html>
<html>
<head>
    <title>Operations</title>
</head>
<body>
    <h1>Counter</h1>
    <h2>Counter: <span id="counter">0</span></h2>
    <button id="incrementButton">Increment +</button>
    <button id="decrementButton">Decrement -</button>
    <button id="resetButton">Reset</button>
    <hr>
    <h1>Operation</h1>
    <h2>Result: <span id="result">0</span></h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <br><br>
    <button id="additionButton">Addition +</button>
    <button id="subtractionButton">Subtraction -</button>
    <button id="multiplicationButton">Multiplication *</button>
    <button id="divisionButton">Division /</button>
    <script>
        let counter = 0;
        // Increment
        document.getElementById("incrementButton").addEventListener("click", function() {
                counter++;
                document.getElementById("counter").innerHTML = counter;
            });
        // Decrement
        document.getElementById("decrementButton").addEventListener("click", function() {
                counter--;
                document.getElementById("counter").innerHTML = counter;
            });
        // Reset
        document.getElementById("resetButton").addEventListener("click", function() {
                counter = 0;
                document.getElementById("counter").innerHTML = counter;
            });
        // Get input values
        function getNumbers() {
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            if (num1 === "" || num2 === "") {
                alert("Please enter both numbers!");
                return null;
            }
            return [Number(num1), Number(num2)];
        }
        // Addition
        function addition() {
            let numbers = getNumbers();
            if (numbers === null) return;
            let result = numbers[0] + numbers[1];
            document.getElementById("result").innerHTML = result;
        }
        // Subtraction
        function subtraction() {
            let numbers = getNumbers();
            if (numbers === null) return;
            let result = numbers[0] - numbers[1];
            document.getElementById("result").innerHTML = result;
        }
        // Multiplication
        function multiplication() {
            let numbers = getNumbers();
            if (numbers === null) return;
            let result = numbers[0] * numbers[1];
            document.getElementById("result").innerHTML = result;
        }
        // Division
        function division() {
            let numbers = getNumbers();
            if (numbers === null) return;
            if (numbers[1] === 0) {
                alert("Cannot divide by zero!");
                return;
            }
            let result = numbers[0] / numbers[1];
            document.getElementById("result").innerHTML = result;
        }
        
        // Button events
        document.getElementById("additionButton")
            .addEventListener("click", addition);
        document.getElementById("subtractionButton")
            .addEventListener("click", subtraction);
        document.getElementById("multiplicationButton")
            .addEventListener("click", multiplication);
        document.getElementById("divisionButton")
            .addEventListener("click", division);
        
    </script>
</body>
</html>
